services:
  # Standalone HaloFPX High-Performance Server (Default: docker compose up -d)
  halofpx-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/julianmb/halofpx:latest
    container_name: halofpx-server
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      - HIP_VISIBLE_DEVICES=0
      - AMD_VULKAN_ICD=RADV
      - RADV_PERFTEST=gpl,sam,nggc
      - HALOFPX_PORT=8010
      # For Strix Halo APUs, uncomment:
      # - HSA_OVERRIDE_GFX_VERSION=11.5.1
      # - GGML_HIP_ENABLE_UNIFIED_MEMORY=1
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
      # If using AMD XDNA NPU on Strix Halo, uncomment:
      # - /dev/accel/accel0:/dev/accel/accel0
    group_add:
      - video
      - render
    volumes:
      - ./models:/app/models
      - hf-cache:/root/.cache/huggingface/hub
      - /var/lib/lemonade/.cache/huggingface/hub:/var/lib/lemonade/.cache/huggingface/hub:ro
    ipc: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional Open WebUI Chat Interface (Launch via: docker compose --profile webui up -d)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: halofpx-open-webui
    restart: unless-stopped
    profiles:
      - webui
      - all
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://halofpx-server:8010/v1
      - OPENAI_API_KEY=sk-no-key
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      halofpx-server:
        condition: service_healthy

volumes:
  hf-cache:
  open-webui-data:
