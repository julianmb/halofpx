[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rocmfpx-server"
version = "1.0.0"
description = "High-Performance Unified Model Server & Model Zoo for ROCmFPX / ROCmFP4 on AMD Strix Halo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Julian Beltran", email = "julian@example.com" },
    { name = "ROCmFPX & Strix Halo Open Source Community" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "huggingface_hub>=0.23.0",
    "tabulate>=0.9.0"
]

[project.scripts]
rocmfpx = "rocmfpx.cli:main"
rocmfpx-server = "rocmfpx.cli:main"

[tool.setuptools.packages.find]
include = ["rocmfpx*"]
