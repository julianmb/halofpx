[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "halofpx"
version = "1.2.0"
description = "High-Performance Unified Model Server & Zoo for AMD Strix Halo (iGPU + NPU, 64GB-128GB)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Julian Beltran", email = "julian@example.com" },
    { name = "HaloFPX & Strix Halo Open Source Community" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "huggingface_hub>=0.23.0",
    "aiohttp>=3.9.0"
]

[project.scripts]
halofpx = "halofpx.cli:main"
halo = "halofpx.cli:main"
rocmfpx = "halofpx.cli:main"
halofpx-server = "halofpx.cli:main"

[tool.setuptools.packages.find]
include = ["halofpx*"]
